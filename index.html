<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/bootstrap.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>basic grid</h1>
        <div class="row">
            <div class="col basic-box">column1</div>
            <div class="col  basic-box">column2</div>
            <div class="col  basic-box">column3</div>
        </div>
    </div>
    <br>
    <div class="container">
        <h1>fixed column width</h1>
  <div class="row">
    <div class="col-6 fixed-box">column1</div>
    <div class="col-6 fixed-box">column2</div>
  </div>
  </div>
  <br>
  <div class="container">
    <h1> responsive grid</h1>
  <div class="row">
    <div class="col-sm-6 col-md-4 responsive-column">small:6 medium:4</div>
    <div class="col-sm-6 col-md-4 responsive-column">small:6 medium:8</div>
  </div>
  </div>
  <br>
  <div class="container">
    <h1>nested grid</h1>
  <div class="row">
    <div class="col-6 nested-inner">outer column1
        <div class="row">
            <div class="col-6 nested-inner">inner column</div>
             <div class="col-6 nested-inner">inner column</div>

        </div>
    </div>
    
  </div>
</div>
<br>
<div class="container">
    <h1>vertical alignment</h1>
    <div class="row">
          <div class="col align-box">top</div>
            <div class="col  align-box">center</div>
            <div class="col  align-box">bottom</div>

    </div>
</div>

</body>
</html>
