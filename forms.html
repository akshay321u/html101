<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container rounded shadow p-3 mt-4">
<H2 class="text-success">1.FORMS OVERVIEW</H2>
<form>
    <div class="mt-4">
        <label for="email" class="form-label">EMAIL ADDRESS</label>
        <input type="email" class="form-control" placeholder="email">
        <div class="form-text">enter your email address</div>
    </div>
    <div class="mt-3">
        <label for="password" class="form-label">PASSWORD</label>
        <input type="password" class="form-control" placeholder="password">
        <div class="form-text">password must be 8 digits</div>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input">
        <label class="form-label">check</label>
    </div>
    <button type="submit" class="btn btn-primary">SUBMIT</button>
</form>
</div> 
<br>
<hr>
<div class="container rounded shadow p-3 mt-4 ">
<H2 class="text-success">2.DISABLED</H2>
<form>
   <fieldset disabled>
    <label class="form-label">EMAIL</label>
    <input type="email" class="form-control" placeholder="email">
    <div class="form-text">email disabled</div>
   </fieldset>
   <div class="mt-3">
    <label class="form-label">PASSWORD</label>
    <input type="password" class="form-control" placeholder="password">
    <div class="form-text">password must be 8 digits</div>
   </div>
   <fieldset disabled>
    <input type="checkbox" class="form-check-input">
    <label class="form-label">check</label>
   </fieldset>
    <button type="submit" class="btn btn-primary">SUBMIT</button>
</form>
</div> 
<br>
<hr>
</body>
</html>
