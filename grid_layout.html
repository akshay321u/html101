<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/bootstrap.css">
    <link rel="stylesheet" href="grid_layout.css">
</head>
<body>
    <h1>1.auto layout columns(equal)</h1>
    <div class="container">
        <div class="row">
            <div class="col auto-box">column1</div>
            <div  class="col auto-box">column2</div>
            <div  class="col auto-box">column3</div>
        </div>
    </div>
    <br>
    <h1>2.equal width + one fixed width </h1>
    <div class="container">
        <div class="row">
            <div class="col auto-box">column1</div>
            <div  class="col-auto fixed-box">column2</div>
            <div  class="col auto-box">column3</div>
        </div>
    </div>
    <br>
    <h1>3.variable width </h1>
    <div class="container">
            <div class="row justify-content-center"></div>
            <div  class="col-auto variable-box">column2</div>
        </div>
    </div>
    <br>
     <h1>4.responsive breakpoints</h1>
    <div class="container">
        <div class="row">
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 responsive-box">column1</div>
            <div  class="col-12 col-sm-6 col-md-8 col-lg-9 responsive-box">column2</div>
        </div>
    </div>
    <br>
     <h1>5.stacked to horizontal</h1>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-8 stacked-box">column1</div>
            <div  class="col-12 col-md-4 stacked-box">column2</div>
        </div>
    </div>
    <br>
     <h1>6.mix and match row and column</h1>
    <div class="container">
        <div class="row">
            <div class="col-6 col-sm-4 mix-box">column1</div>
            <div  class="col-6 col-sm-4 mix-box">column2</div>
            <div class="col-12 col-sm-4 mix-box">column3</div>
        </div>
    </div>
    

    
</body>
</html>
