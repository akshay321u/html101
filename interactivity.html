<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h3 class="text-success mb-3 p-3">1.SHADOW</h3>
    <div class="shadow mb-4">default shadow</div>
    <div class="shadow-sm mb-4">small shadow</div>
    <div class="shadow-lg mb-4">large shadow</div>

    <h3 class="text-success mb-3 p-3">2.CURSOR UTILITIES</h3>
    <button class="cursor-pointer bg-primary">click </button>
    <span class="cursor-default">normal text</span>

    <h3 class="text-success mb-3 p-3">3.opacity</h3>
    <div class="opacity-0 bg-primary text-white p-2">0% visible</div>
    <div class="opacity-25 bg-primary text-white p-2">25% visible</div>
    <div class="opacity-50 bg-primary text-white p-2">50% visible</div>
    <div class="opacity-75 bg-primary text-white p-2">75% visible</div>
    <div class="opacity-100 bg-primary text-white p-2">100% visible</div>

    <h3 class="text-success mb-3 p-3">4.z index</h3>
    <div class="position-relative" style="height: 150px;">
    <div class="position-absolute top-0 start-0 z-3 bg-primary p-2" style="width: 100px;">z-1</div>
    <div class="position-absolute top-50 start-50 z-1 bg-primary p-2" style="width: 100px;">z-1</div>
    <div class="position-absolute top-100 start-100 z-0 bg-primary p-2" style="width: 100px;">z-1</div>
    </div>
</div>    
</body>
</html>
