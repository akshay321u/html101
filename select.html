<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container rounded shadow p-3 mt-4">
<h2 class="text-success">1.DEFAULT SELECT</h2>
<select class="form-select" >
  <option selected>Open this select menu</option>
  <option value="1">One</option>
  <option value="2">Two</option>
  <option value="3">Three</option>
</select>    
</div>
<br>
<hr>
<div class="container rounded shadow p-3 mt-4">
<h2 class="text-success">2.SIZING SELECT CONTROL</h2>
<h6 class="text-warning">large</h6>
<select class="form-select form-select-lg" >
  <option selected>Open this select menu</option>
  <option value="1">One</option>
  <option value="2">Two</option>
  <option value="3">Three</option>
</select>    
<br>
<h6 class="text-warning">small</h6>
<select class="form-select form-select-sm" >
  <option selected>Open this select menu</option>
  <option value="1">One</option>
  <option value="2">Two</option>
  <option value="3">Three</option>
</select>    
<br>
<h6 class="text-warning">size</h6>
<select class="form-select" size="2">
  <option selected>Open this select menu</option>
  <option value="1">One</option>
  <option value="2">Two</option>
  <option value="3">Three</option>
</select>    
<br>
<h6 class="text-warning">multiple</h6>
<select class="form-select" multiple>
  <option selected>Open this select menu</option>
  <option value="1">One</option>
  <option value="2">Two</option>
  <option value="3">Three</option>
</select>    
<br>
</div>
<br>
<hr>
<div class="container rounded shadow p-3 mt-4">
<h2 class="text-success">3.DISABLED SELECT CONTROL</h2>
<select class="form-select" disabled>
  <option selected>Open this select menu</option>
  <option value="1">One</option>
  <option value="2">Two</option>
  <option value="3">Three</option>
</select>    
</div>
<br>
<hr>


</body>
</html>
